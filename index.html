<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지구과학 데이터 분석실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f9f9f9; }
        .glass { background: white; border: 1px solid #e5e5e5; border-radius: 8px; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 6px; color: #767676; white-space: nowrap; font-size: 0.8rem; border: 1px solid #eee; }
        .tab-btn.active { background: #000; color: #fff; }
    </style>
</head>
<body class="p-8">
    <main class="max-w-4xl mx-auto space-y-6">
        <div class="glass p-6">
            <h2 class="text-sm font-semibold mb-4 text-gray-500 uppercase">2. 데이터 업로드 (CSV)</h2>
            <input type="file" id="csvFile" class="block w-full text-sm">
        </div>

        <div id="analysisSection" class="hidden glass p-6">
            <div id="yearTabs" class="flex gap-2 mb-4 overflow-x-auto pb-2"></div>
            <div class="h-64"><canvas id="mainChart"></canvas></div>
        </div>
    </main>

    <script>
        let rawData = [];
        let myChart = null;

        document.getElementById('csvFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const buffer = await file.arrayBuffer();
            // EUC-KR 인코딩 처리
            const text = new TextDecoder('euc-kr').decode(buffer);
            const lines = text.split('\n');

            rawData = [];
            lines.forEach(line => {
                const cols = line.split(',').map(c => c.trim());
                // 첫 컬럼이 4자리 연도인 데이터만 추출
                if (/^\d{4}$/.test(cols[0])) {
                    rawData.push({
                        year: cols[0],
                        months: cols.slice(1, 13).map(n => parseFloat(n) || 0)
                    });
                }
            });
            renderTabs();
        });

        function renderTabs() {
            document.getElementById('analysisSection').classList.remove('hidden');
            const tabContainer = document.getElementById('yearTabs');
            tabContainer.innerHTML = rawData.map((d, i) => 
                `<button class="tab-btn" onclick="selectYear(${i}, this)">${d.year}년</button>`
            ).join('');
            if(rawData.length > 0) selectYear(0, tabContainer.firstChild);
        }

        function selectYear(index, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],
                    datasets: [{ label: '악기상 횟수', data: rawData[index].months, backgroundColor: '#000' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
