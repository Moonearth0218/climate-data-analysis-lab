<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구과학 데이터 분석실</title>
    <!-- Tailwind CSS 안정적 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f7f7f5; color: #37352f; }
        .glass { background: white; border: 1px solid #e5e5e5; border-radius: 8px; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 6px; color: #767676; transition: 0.2s; font-size: 0.9rem; }
        .tab-btn.active { background: #e5e5e5; color: #000; font-weight: 600; }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- 위쪽 UI는 동일하게 유지 -->
    <header class="max-w-4xl mx-auto mb-8 flex justify-between items-center">
        <h1 class="text-xl font-bold">지구과학 데이터 분석실</h1>
        <div class="flex gap-2">
            <button onclick="setView('student')" class="px-4 py-2 bg-black text-white rounded-lg text-sm">학생 화면</button>
            <button onclick="setView('teacher')" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm">교사 대시보드</button>
        </div>
    </header>

    <main id="app" class="max-w-4xl mx-auto">
        <!-- Student Module -->
        <div id="studentView">
            <div class="glass p-6 mb-6">
                <input type="text" id="studentId" placeholder="학번" class="p-2 border rounded w-full mb-2">
                <input type="text" id="studentName" placeholder="이름" class="p-2 border rounded w-full">
            </div>
            <div class="glass p-6 mb-6">
                <input type="file" id="csvFile" class="block w-full text-sm text-gray-500">
            </div>
            <div id="analysisSection" class="hidden">
                <div id="yearTabs" class="flex gap-2 mb-4"></div>
                <div class="glass p-6 h-80 mb-8"><canvas id="mainChart"></canvas></div>
            </div>
            <div class="glass p-6 space-y-6">
                <textarea id="q1" class="w-full p-3 border rounded" placeholder="Q1. 특이점"></textarea>
                <textarea id="q2" class="w-full p-3 border rounded" placeholder="Q2. 경향성"></textarea>
                <textarea id="q3" class="w-full p-3 border rounded" placeholder="Q3. 원인 분석"></textarea>
                <button onclick="submitReport()" class="w-full py-3 bg-black text-white rounded-lg font-bold">최종 제출</button>
            </div>
        </div>
        <!-- Teacher Module -->
        <div id="teacherView" class="hidden">
            <div class="glass p-6">
                <h2 class="text-lg font-bold mb-6">제출 현황</h2>
                <div id="submissionList" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK (최신 버전) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 본인의 파이어베이스 설정값으로 교체
        const firebaseConfig = {
            apiKey: "AIzaSyDURyiBbY-adOrAI6ZnsLqI13cW95dR5Lw",
            authDomain: "climate-data-analysis-lab.firebaseapp.com",
            projectId: "climate-data-analysis-lab",
            storageBucket: "climate-data-analysis-lab.firebasestorage.app",
            messagingSenderId: "190687339710",
            appId: "1:190687339710:web:ca4df028ad3192029e6aef"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 학생 제출 기능
        window.submitReport = async () => {
            const studentInfo = document.getElementById('studentId').value + " " + document.getElementById('studentName').value;
            try {
                await addDoc(collection(db, "reports"), {
                    student: studentInfo,
                    q1: document.getElementById('q1').value,
                    q2: document.getElementById('q2').value,
                    q3: document.getElementById('q3').value,
                    date: new Date().toISOString()
                });
                alert("제출이 완료되었습니다!");
            } catch (e) { alert("저장 실패: " + e.message); }
        };

        // 교사 대시보드 불러오기
        window.loadSubmissions = async () => {
            const list = document.getElementById('submissionList');
            const querySnapshot = await getDocs(collection(db, "reports"));
            list.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const s = doc.data();
                list.innerHTML += `<div class="p-4 border rounded">${s.student} - ${s.q1}</div>`;
            });
        };
        
        window.setView = (view) => {
            document.getElementById('studentView').classList.toggle('hidden', view !== 'student');
            document.getElementById('teacherView').classList.toggle('hidden', view !== 'teacher');
            if(view === 'teacher') loadSubmissions();
        };
    </script>
</body>
</html>
